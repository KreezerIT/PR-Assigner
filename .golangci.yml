version: "2"

run:
  timeout: 5m
  tests: false
  skip-dirs:
    - tests
  skip-files:
    - ".*_test.go"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - gocritic

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic
    - path: tests/
      linters:
        - errcheck
        - unused

output:
  format: colored-line-number