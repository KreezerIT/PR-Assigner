services:
  postgres_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prservice_test
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: pr_reviewer_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prservice_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - TEST_DB_HOST=postgres_test
      - TEST_DB_PORT=5432
      - TEST_DB_USER=prservice_test
      - TEST_DB_PASSWORD=test_pass
      - TEST_DB_NAME=pr_reviewer_test
    depends_on:
      postgres_test:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
      - ./coverage.out:/app/coverage.out