services:
  postgres_test:
    image: postgres:15-alpine
    container_name: pr_reviewer_test_db
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-prservice_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test_pass}
      POSTGRES_DB: ${TEST_DB_NAME:-pr_reviewer_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-prservice_test} -d ${TEST_DB_NAME:-pr_reviewer_test}"]
      interval: 2s
      timeout: 3s
      retries: 10

  test_runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: pr_reviewer_test_runner
    environment:
      TEST_DB_HOST: ${TEST_DB_HOST:-postgres_test}
      TEST_DB_PORT: ${TEST_DB_PORT:-5432}
      TEST_DB_USER: ${TEST_DB_USER:-prservice_test}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-test_pass}
      TEST_DB_NAME: ${TEST_DB_NAME:-pr_reviewer_test}
    depends_on:
      postgres_test:
        condition: service_healthy
    volumes:
      - ./:/app
      - go-cache:/go/pkg/mod

volumes:
  go-cache: