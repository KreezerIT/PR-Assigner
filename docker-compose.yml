services:
  postgres:
    image: postgres:15-alpine
    container_name: pr_reviewer_db
    environment:
      POSTGRES_USER: ${DB_USER:-prservice}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prservice_pass}
      POSTGRES_DB: ${DB_NAME:-prservice}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prservice} -d ${DB_NAME:-prservice}"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    container_name: pr_reviewer_migrate
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-prservice}
      DB_PASSWORD: ${DB_PASSWORD:-prservice_pass}
      DB_NAME: ${DB_NAME:-prservice}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until nc -z postgres 5432; do
          sleep 2
        done
        
        PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -lqt | cut -d \| -f 1 | grep -qw $$DB_NAME || \
        PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d postgres -c "CREATE DATABASE $$DB_NAME;"
        
        migrate -path /root/migrations \
                -database "postgres://$$DB_USER:$$DB_PASSWORD@postgres:5432/$$DB_NAME?sslmode=$$DB_SSLMODE" \
                up
        echo "Migrations completed successfully"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/root/migrations

  api:
    container_name: pr_reviewer_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-prservice}
      DB_PASSWORD: ${DB_PASSWORD:-prservice_pass}
      DB_NAME: ${DB_NAME:-prservice}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_RETRIES: ${DB_MAX_RETRIES:-5}
      DB_RETRY_DELAY: ${DB_RETRY_DELAY:-2s}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data: