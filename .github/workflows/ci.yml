name: CI

on:
  - push
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: prservice_test
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: pr_reviewer_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Run integration tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_USER: prservice_test
          TEST_DB_PASSWORD: test_pass
          TEST_DB_NAME: pr_reviewer_test
        run: go test ./tests/integration/... -v
